<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cello Note Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> 
      <h1>Cello Note Detector</h1>
      <p> Listen to a cello and writes down the notes, live or from a recording</p>
    </header>
    
    <nav class ="tabs">
      <button class = "tab active" data-tab = "live">Live Microphone</button>
      <button class = "tab" data-tab="upload">Upload Recording</button>
    </nav>

    <main>
      <section id = "live" class = "card">
        <button id = "micBtn" class = "primary"> Start Microphone </button>
        <div id = "liveNote">-</div>
        <div id = "liveInfo"> Play or hum a note near the mic</div>
        <canvas id = "liveRoll" width = "900" height="260"></canvas>
      </section>

      <section id = "upload" class = "card" hidden>
        <div class = "row">
          <input type = "file" id = "file" accept = "audio/*">
          <button id = "go" class = "primary"> Detect Notes</button>
        </div>
        <div id = "status"> Choose a solo cello clip (WAV)</div>
        <audio id="player" controls></audio>
        <canvas id="roll" width="900" height="320"></canvas>
        <div id="list"></div>
      </section>
    </main>
    
  <script src="script.js"></script>
  <script src="live.js"></script>   
</body>
</html>
